# 차단판. 관측판과 훅·인자·필터가 같고 matchActions 만 다르다.
#
# Sigkill 이 아니라 Override 를 쓴다. Sigkill 은 시스템콜이 제 일을 끝낸 뒤에
# 프로세스를 죽이므로 막으려던 변경이 이미 일어나 있다. setuid 에서 실측했다.
# 프로세스는 종료코드 137 로 죽었는데 결과는 -rwsr-xr-x 였다.
# Override 는 커널 함수의 반환값을 오류로 바꿔 변경 자체가 일어나지 않게 한다.
#
# metadata.name 은 관측판과 같다. 두 판을 동시에 올리지 않으므로 충돌하지 않고,
# 채점하는 쪽은 모드가 바뀌어도 같은 규칙 이름으로 집계한다.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "t1548-003-sudo-abuse"
spec:
  kprobes:
  # sudo 설정을 고쳐 비밀번호 없이 root 가 되게 만드는 동작.
  #
  # 한계를 먼저 적어둔다. 컨테이너는 대부분 처음부터 root 로 돌기 때문에
  # sudo 를 쓸 이유가 없다. 최소 이미지에는 sudo 가 설치돼 있지도 않다.
  # 그래서 이 규칙은 컨테이너보다 탈출 이후의 호스트에서 의미가 있다.
  # 확정 표에 있어서 만들었으나 컨테이너 단독 시나리오는 성립하지 않는다.
  - call: "security_file_open"
    syscall: false
    tags: [ "T1548.003", "pbpf:single" ]
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/sudoers"       # /etc/sudoers 와 /etc/sudoers.d/ 를 함께 덮는다
        - "/var/run/sudo/ts/"  # 비밀번호를 다시 안 묻는 캐시 파일
        - "/var/db/sudo/"
      matchActions:
      - action: Override
        argError: -1   # -EPERM
