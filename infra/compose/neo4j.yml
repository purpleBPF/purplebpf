services:
  neo4j:
    image: neo4j:5-community
    container_name: purplebpf-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4jdata:/data

volumes:
  neo4jdata:
