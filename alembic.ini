[alembic]
# db/migrations 디렉토리를 마이그레이션 스크립트 위치로 사용한다.
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url은 하드코딩하지 않는다.
# 실제 접속 URL은 db/migrations/env.py에서 DATABASE_URL 환경변수로부터 읽는다.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
