apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "t1548-001-setuid-bit-set"
spec:
  kprobes:
  # security_path_chmod(const struct path *path, umode_t mode)
  # chmod 계열 syscall(chmod/fchmod/fchmodat)이 전부 여기로 수렴
  # syscall 진입점 대신 LSM 훅을 잡는 이유: 진입점은 3개인데 여기는 1개
  - call: "security_path_chmod"
    syscall: false
    args:
    - index: 0
      type: "path"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Mask"
        values:
        - "2048"   # S_ISUID (04000)
        - "1024"   # S_ISGID (02000)