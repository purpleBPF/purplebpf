apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  # ATT&CK 매핑이 없다. 익명 메모리 파일을 만드는 것 자체는 기법이 아니다.
  # 만들고 실행해야 파일 없는 실행이 되고, 그 실행은 t1620-fileless-exec 가
  # 잡는다. 여기에 기법 번호를 붙이면 만들기만 해도 잡았다고 세어진다.
  #
  # 그래도 규칙으로 남기는 이유는 앞 단계 신호라서다. 실행보다 먼저 보이고,
  # 최소 이미지 컨테이너에서 memfd 를 만들 일이 드물다.
  name: "memfd-create"
spec:
  kprobes:
  - call: "sys_memfd_create"
    syscall: true
    tags: [ "pbpf:single", "pbpf:no-attack-mapping" ]
    args:
    - index: 0
      type: "string"
    - index: 1
      type: "int"
