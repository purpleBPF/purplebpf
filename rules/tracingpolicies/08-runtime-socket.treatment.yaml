apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "pbpf-08-runtime-socket-treatment"
spec:
  kprobes:
  # 소켓은 open 이 아니라 connect 라 security_file_open 으로는 안 잡힌다.
  # sun_path 추출은 Tetragon 1.7.0 의 sockaddr_un 지원이 있어야 가능.
  - call: "unix_stream_connect"
    syscall: false
    tags: [ "T1610", "pbpf:treatment" ]
    args:
    - index: 0
      type: "socket"
    - index: 1
      type: "sockaddr_un"
    selectors:
    - matchArgs:
      - index: 1
        # Postfix 는 sockaddr_un 에 안 먹는다 (1.7.0 실측). Equal 로 전체 경로를 나열한다.
        operator: "Equal"
        values:
        - "/var/run/docker.sock"
        - "/run/docker.sock"
        - "/var/run/containerd/containerd.sock"
        - "/run/containerd/containerd.sock"
        - "/var/run/crio/crio.sock"
        - "/run/crio/crio.sock"
