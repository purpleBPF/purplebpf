apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "pbpf-11-reverse-shell-treatment"
spec:
  kprobes:
  - call: "tcp_connect"
    syscall: false
    tags: [ "T1059.004", "pbpf:treatment" ]
    args:
    - index: 0
      type: "sock"
  - call: "security_bprm_check"
    syscall: false
    tags: [ "T1059.004", "pbpf:treatment" ]
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/sh"
        - "/bash"
        - "/dash"
