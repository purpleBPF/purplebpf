apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "pbpf-08-runtime-socket-baseline"
spec:
  kprobes:
  # baseline = 시스템콜 진입점. io_uring SOCKET/CONNECT 는 여기를 안 지난다.
  - call: "sys_connect"
    syscall: true
    tags: [ "T1610", "pbpf:baseline" ]
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "sockaddr"
    - index: 2
      type: "int"
