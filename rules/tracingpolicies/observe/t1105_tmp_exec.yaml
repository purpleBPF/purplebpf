apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "t1105-tmp-exec"
spec:
  kprobes:
  # 임시 경로에서 프로그램을 실행하는 것만 본다.
  #
  # 처음에는 파일을 떨어뜨리는 순간(security_file_open)도 같이 걸었다.
  # 그런데 /tmp 에 파일을 여는 것은 postgres, runc, containerd 가 늘 하는
  # 정상 동작이라 오탐이 대부분이었다. 20초에 13건이 떴고 전부 열기 훅에서
  # 나왔으며 실행 훅에서는 한 건도 안 나왔다.
  #
  # 공격의 특징은 떨어뜨린 것이 아니라 떨어뜨린 것을 실행한 것이다.
  # /tmp 에서 프로그램을 실행하는 일은 정상 시스템에 거의 없다.
  # 열기 훅을 빼고 실행 훅만 남기니 같은 공격을 잡으면서 오탐이 사라졌다.
  #   현재(열기+실행)  20초에 23건 발화, 그중 공격 5건
  #   실행 훅만        20초에  1건 발화, 그중 공격 1건
  #
  # 쓰기 조건을 거는 방법(security_file_permission 에 MAY_WRITE)도 시험했으나
  # 그 훅은 읽기·쓰기마다 불려서 10만 건 가까이 나왔다. 쓰면 안 된다.
  - call: "security_bprm_check"
    syscall: false
    tags: [ "T1105", "pbpf:treatment" ]
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/dev/shm/"
        - "/run/shm/"
        - "/var/tmp/"
