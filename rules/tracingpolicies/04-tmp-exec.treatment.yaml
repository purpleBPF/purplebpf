apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "pbpf-04-tmp-exec-treatment"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    tags: [ "T1105", "pbpf:treatment" ]
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/dev/shm/"
        - "/run/shm/"
        - "/var/tmp/"
  - call: "security_bprm_check"
    syscall: false
    tags: [ "T1105", "pbpf:treatment" ]
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/dev/shm/"
        - "/run/shm/"
        - "/var/tmp/"
