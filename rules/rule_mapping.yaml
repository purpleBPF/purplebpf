# 탐지 → ATT&CK technique 매핑
# Mapper가 이 파일을 읽어 Tetragon 이벤트에 technique을 태깅
# 탐지 출처가 두 가지라 섹션이 나뉜다.

# TracingPolicy로 정의한 탐지. Tetragon 이벤트의 policy_name으로 식별한다.
# observe/ 와 enforce/ 는 metadata.name이 같으므로 한 항목이 두 모드를 다 덮는다.
policies:
  t1548-001-setuid-bit-set:
    technique: T1548.001
    # 탐지가 잡는 ATT&CK 번호
    leg: setuid 비트 설정
    hook: security_path_chmod
    requires: CONFIG_SECURITY_PATH=y
    io_uring: 비대상   # chmod 옵코드가 없다 (io_uring.h 확인)

  t1610-runtime-socket-connect:
    technique: T1610
    leg: 런타임 소켓 연결
    hook: unix_stream_connect
    requires: Tetragon 1.7.0 이상 (sockaddr_un 타입)
    note: 호스트의 docker CLI도 잡힌다. 컨테이너 ID 유무로 걸러야 한다
    io_uring: 대상     # SOCKET/CONNECT/WRITE 옵코드가 있다

  t1552-001-cred-file-read:
    technique: T1552.001
    leg: 자격증명 파일 읽기
    hook: security_file_permission
    note: SA 토큰은 kubelet과 SDK가 상시 읽는다. 오탐 베이스라인 없이는 FP를 못 센다
    io_uring: 대상     # 대조실험 본진

  t1611-namespace-change:
    technique: T1611
    leg: 네임스페이스 변경
    hook: sys_setns, sys_unshare
    io_uring: 비대상

  t1611-host-mount:
    technique: T1611
    leg: 네임스페이스 변경 후 호스트 마운트
    hook: security_sb_mount
    io_uring: 비대상

  t1105-tmp-exec:
    technique: T1105
    leg: 임시 경로 드롭 및 실행
    hook: security_file_open, security_bprm_check
    note: 경로 접두사만 보면 정상 빌드 컨테이너에서 뜬다. 컨테이너 시작 후 생성 조건이 필요하다
    io_uring: 대상     # 드롭 레그만. 실행 레그는 execve라 불가


  t1552-005-cloud-metadata:
    technique: T1552.005
    leg: IMDS 연결
    hook: tcp_connect
    io_uring: 대상

  t1562-001-defense-tamper:
    technique: T1562.001
    leg: BPF 프로그램 detach, 에이전트 프로세스 종료
    hook: security_bpf, sys_kill
    note: |
      자기참조. 탐지기를 죽이는 데 성공하면 탐지 기록 자체가 사라진다.
      미탐과 탐지기 사망을 구분하는 결과 코드가 채점기에 따로 필요하다.
      ATT&CK ID 재편(T1685) 여부 미확인.
    io_uring: 비대상


  t1613-container-discovery:
    technique: T1613
    leg: 컨테이너 여부와 자원 정찰
    hook: security_file_open
    note: /.dockerenv 와 /proc/self/cgroup 은 정상 애플리케이션이 읽을 일이 없다
    io_uring: 대상     # 파일 읽기라 OPENAT/READ 로 수행 가능

  t1055-008-ptrace-inject:
    technique: T1055.008
    leg: ptrace 로 남의 프로세스 메모리에 코드 주입
    hook: sys_ptrace
    note: |
      요청 종류로 좁혔다. POKETEXT(4), POKEDATA(5), SETREGS(13), ATTACH(16).
      읽기 계열은 디버깅과 구분이 안 되어 뺐다.
      컨테이너는 보통 프로세스가 하나라 주입 대상이 없다. 씨앗 체인은
      대상 프로세스를 직접 띄우므로 시나리오가 인위적이다.
    io_uring: 비대상   # ptrace 옵코드 없음

  t1055-009-proc-mem-inject:
    technique: T1055.009
    leg: /proc/<pid>/mem 쓰기로 메모리 주입
    hook: security_file_permission
    note: |
      ptrace 를 막아둔 환경에서 쓰이는 우회로다. MAY_WRITE(2) 만 본다.
      경로도 mem 으로 끝나는 것에 한정한다. /proc 아래 쓰기 전체를 잡으면
      프로세스가 자기 oom_score_adj 나 comm 을 고치는 평범한 동작이 늘 뜬다.
    io_uring: 대상     # 파일 쓰기라 WRITE 로 수행 가능

  t1548-003-sudo-abuse:
    technique: T1548.003
    leg: sudoers 수정, sudo 캐시 접근
    hook: security_file_open
    note: |
      컨테이너 단독 시나리오가 성립하지 않는다. 대부분 처음부터 root 로 돌아
      sudo 를 쓸 이유가 없고 최소 이미지에는 설치도 안 돼 있다.
      탈출 이후 호스트 단계에서 의미가 있다.
    io_uring: 대상     # 파일 접근

# TracingPolicy 없이 Tetragon 기본 exec 스트림에서 판정하는 탐지.
#
# 기본 센서가 모든 exec 이벤트를 이미 내보내므로 정책을 추가하면
# 같은 이벤트가 두 번 올라와 비용만 늘어난다. 유저스페이스에서 판정한다.
#
# match 는 Mapper 가 읽는다. kind 마다 필요한 항목이 다르다.
#   cred_transition        uid 와 euid 가 다른 exec
#   parent_child_binary    child_postfix 와 parent_postfix 를 둘 다 만족
#   binary_prefix          실행 파일 경로가 values 중 하나로 시작
# 경로 끝으로 맞추는 것은 TracingPolicy 의 Postfix 와 같은 방식이다.
# /usr/sbin/nginx 든 /usr/local/bin/nginx 든 같은 항목으로 걸린다.
stream_rules:
  setuid-exec-escalation:
    technique: T1548.001
    leg: setuid 비트 바이너리 execve, UID != EUID 전이
    source: process_exec
    match:
      kind: cred_transition
    condition: process_credentials.uid != process_credentials.euid
    requires: tetragon --enable-process-cred
    example:
      binary: /tmp/rootsh
      process_credentials: { uid: 1000, euid: 0, suid: 0 }
    note: |
      씨앗 체인이 없다. 이 설정에서는 규칙이 뜰 수가 없어서다.

      두 겹으로 막힌다. 컨테이너가 root 로 돌면 uid 도 euid 도 0 이라
      갈릴 게 없다. 비특권 사용자로 내려가 실행해도 마찬가지인데,
      Executor 가 컨테이너에 no-new-privileges 를 걸기 때문이다.
      이 설정이 켜져 있으면 setuid 비트가 붙어 있어도 커널이 권한을 안 준다.
      실측: setpriv --reuid=65534 로 setuid 바이너리를 실행해도
      uid=65534 euid=65534 그대로다.

      T1611 이 seccomp 에 막히는 것과 같은 부류다. 공격이 안 통하는 것을
      미탐으로 세면 안 되므로 체인을 만들지 않는다. 규칙을 지우지도 않는다.
      no-new-privileges 를 안 거는 환경에서는 그대로 쓸 수 있다.

  fileless-fd-exec:
    technique: T1620
    leg: 경로 없는 파일을 서술자로 실행
    source: process_exec
    match:
      kind: binary_prefix
      values: [ "/dev/fd/", "/proc/self/fd/" ]
    requires: 없음. 기본 센서가 모든 exec 이벤트를 내보낸다
    note: |
      TracingPolicy 로 안 된다. 조건을 걸 대상이 없어서다.

      memfd 로 만든 파일은 파일시스템에 경로가 없다. security_bprm_check 의
      linux_binprm 인자를 조건 없이 찍어보면 memfd 실행만 path 필드가 통째로
      빠진 채로 온다.

        {"linux_binprm_arg": {"permission": "-rwxrwxrwx"}}

      경로가 없다는 것 자체가 신호인데 matchArgs 는 "비었다" 를 못 쓴다.
      memfd: 로 시작하는 경로를 기대했으나 ELF 를 직접 넣어봐도 안 왔다.
      그 이름은 파일의 d_path 에만 있고 bprm 에는 안 들어간다.

      exec 스트림에는 실행을 어떻게 불렀는지가 남는다.
        execveat(fd, "", AT_EMPTY_PATH)  ->  /dev/fd/<n>
        execve("/proc/self/fd/<n>")      ->  /proc/self/fd/<n>
      둘 다 커널이 붙이는 이름이다. 평범한 프로그램은 경로로 실행하지
      서술자로 실행하지 않는다.

      /proc/<pid>/fd/ 형태는 못 잡는다. 자기 서술자를 실행할 때는 보통
      self 를 쓴다. 남의 서술자를 실행하려면 그 경로를 먼저 열어야 하는데
      그건 다른 규칙에 걸린다.

      차단은 안 된다. 유저스페이스 판정이라 막을 수단이 없다. 막으려면
      memfd 생성 단계(memfd-create)를 막아야 하는데 정상 프로그램도 쓴다.

  anomalous-shell-spawn:
    technique: T1059.004
    leg: 웹·DB 서버가 셸을 자식으로 띄우는 것
    source: process_exec
    match:
      kind: parent_child_binary
      child_postfix: [ "/sh", "/bash", "/dash", "/zsh", "/ash" ]
      parent_postfix: [ "/nginx", "/httpd", "/apache2", "/postgres", "/mysqld",
                        "/node", "/java", "/php-fpm", "/gunicorn", "/uwsgi" ]
    condition: |
      process.binary 가 셸이고 parent.binary 가 서버 프로세스일 것.
    requires: 없음. 기본 센서가 모든 exec 이벤트를 내보낸다
    note: |
      TracingPolicy 로 안 만든 이유가 있다. 부모 프로세스 조건을 커널 안에서
      표현할 수 없다. security_bprm_check 에서 matchBinaries 는 새로 실행될
      바이너리를 보고, matchParentBinaries 는 parents_map 을 켜도 의도대로
      걸러지지 않았다(1.7.0 실측).
      컨테이너가 셸을 띄우는 것 자체는 정상이라 조건 없이 잡으면 오탐만 는다.
      부모가 서버 프로세스일 때로 좁혀야 신호가 된다.

      건강검진이 헷갈릴 만한데 실측으로는 안 걸린다. 도커 healthcheck 의
      셸은 부모가 runc 나 containerd-shim 이지 서버 프로세스가 아니다.

# 기법을 안 붙였지만 오탐은 재는 규칙.
#
# 여기 적힌 것은 Mapper 가 technique=UNMAPPED 로 기록한다. 기법이 없다는 것과
# 안 떠도 된다는 것은 다르다. 정상 워크로드에서 뜨면 그건 오탐이다.
# UNMAPPED 는 어떤 공격과도 안 맞으므로 재현율에는 안 섞인다.
#
# 여기에도 policies 에도 없는 policy_name 은 버린다. 경고만 낸다.
# 모르는 정책의 이벤트가 오탐 데이터로 조용히 섞이면 안 되기 때문이다.
unmapped_policies:
  exec-admin-tools:     실행 중인 컨테이너에서 패키지 관리자나 네트워크 도구 실행
  exec-file-capability: 파일에 capability 부여
  memfd-create:         익명 메모리 파일 생성. 파일 없는 실행의 앞 단계

# experiments/ 의 baseline 정책은 위 어디에도 등재하지 않는다.
# 일부러 뚫리라고 만든 실험 장비라 커버리지에도 오탐에도 섞이면 안 된다.
# 대조실험 결과는 baseline/treatment 쌍을 따로 비교해 산출한다.
#   t1552-001-cred-file-read-baseline
#   t1105-tmp-exec-baseline
#   t1552-005-cloud-metadata-baseline
#   t1610-runtime-socket-baseline
