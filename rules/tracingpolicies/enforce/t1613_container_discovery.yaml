# 차단판. 관측판과 훅·인자·필터가 같고 matchActions 만 다르다.
#
# Sigkill 이 아니라 Override 를 쓴다. Sigkill 은 시스템콜이 제 일을 끝낸 뒤에
# 프로세스를 죽이므로 막으려던 변경이 이미 일어나 있다. setuid 에서 실측했다.
# 프로세스는 종료코드 137 로 죽었는데 결과는 -rwsr-xr-x 였다.
# Override 는 커널 함수의 반환값을 오류로 바꿔 변경 자체가 일어나지 않게 한다.
#
# metadata.name 은 관측판과 같다. 두 판을 동시에 올리지 않으므로 충돌하지 않고,
# 채점하는 쪽은 모드가 바뀌어도 같은 규칙 이름으로 집계한다.
#
# matchActions 는 selector 마다 따로 붙는다. 하나에만 붙이면 나머지 selector 는
# 관측만 하고 안 막는다. 차단판인 줄 알고 올렸는데 절반만 막히는 상태가 된다.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "t1613-container-discovery"
spec:
  kprobes:
  # 컨테이너 안에 있는지, 무엇이 붙어 있는지 확인하는 정찰 동작.
  # 공격자가 발판을 잡은 직후 가장 먼저 하는 일이다.
  #
  # /proc/self/... 로 열어도 커널이 보는 경로는 /proc/<pid>/... 로 풀린다.
  # 그래서 Equal 로는 안 맞고 Postfix 로 끝부분을 본다(실측).
  #
  # 조건은 관측판과 글자 그대로 같아야 한다. 다르면 관측판으로 잰 정밀도가
  # 차단판의 정밀도가 아니게 된다. 차단은 틀리면 대가가 훨씬 크다.
  - call: "security_file_open"
    syscall: false
    tags: [ "T1613", "pbpf:single" ]
    args:
    - index: 0
      type: "file"
    selectors:
    # /proc 아래로 한정한다. Postfix 만 쓰면 /sys/fs/cgroup 에도 걸리는데,
    # 컨테이너가 자기 메모리 한도를 읽을 때 여는 디렉터리다. 관측판이면
    # 오탐 한 건이지만 차단판이면 컨테이너가 자원 정보를 못 읽게 된다.
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values: [ "/proc/" ]
      - index: 0
        operator: "Postfix"
        values: [ "/cgroup" ]
      matchActions:
      - action: Override
        argError: -1   # -EPERM
    # df 가 남은 용량을 계산하려고 마운트 목록을 읽는다. 정찰과 여는 파일이
    # 같다(실측). 여기서 안 빼면 차단판이 df 를 못 쓰게 만든다.
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values: [ "/proc/" ]
      - index: 0
        operator: "Postfix"
        values: [ "/mountinfo" ]
      matchBinaries:
      - operator: "NotIn"
        values:
        - "/usr/bin/df"
        - "/bin/df"
        - "/usr/bin/mount"
        - "/bin/mount"
        - "/usr/bin/umount"
        - "/bin/umount"
        - "/usr/bin/findmnt"
        - "/usr/bin/lsblk"
      matchActions:
      - action: Override
        argError: -1   # -EPERM
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/.dockerenv"   # 도커가 컨테이너 루트에 넣어두는 표시 파일
        - "/run/secrets/kubernetes.io/serviceaccount/namespace"
      matchActions:
      - action: Override
        argError: -1   # -EPERM
