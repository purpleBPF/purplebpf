# 차단판. 관측판과 훅·인자·필터가 같고 matchActions 만 다르다.
#
# Sigkill 이 아니라 Override 를 쓴다. Sigkill 은 시스템콜이 제 일을 끝낸 뒤에
# 프로세스를 죽이므로 막으려던 변경이 이미 일어나 있다. setuid 에서 실측했다.
# 프로세스는 종료코드 137 로 죽었는데 결과는 -rwsr-xr-x 였다.
# Override 는 커널 함수의 반환값을 오류로 바꿔 변경 자체가 일어나지 않게 한다.
#
# metadata.name 은 관측판과 같다. 두 판을 동시에 올리지 않으므로 충돌하지 않고,
# 채점하는 쪽은 모드가 바뀌어도 같은 규칙 이름으로 집계한다.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "t1552-001-cred-file-read"
spec:
  kprobes:
  # treatment = 커널 내부 함수. read/write/sendfile/splice/aio/io_uring 이 전부 여기로 수렴한다.
  # 채널과 무관하게 잡히는 것이 baseline 과의 차이.
  - call: "security_file_permission"
    syscall: false
    tags: [ "T1552.001", "pbpf:treatment" ]
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/var/run/secrets/kubernetes.io/serviceaccount"
        - "/run/secrets/kubernetes.io/serviceaccount"
        - "/root/.aws/credentials"
        - "/root/.ssh/id_rsa"
      - index: 1
        operator: "Equal"
        values:
        - "4"   # MAY_READ
      matchActions:
      - action: Override
        argError: -1   # -EPERM
